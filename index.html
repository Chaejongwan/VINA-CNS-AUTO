<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTO 사업부 대시보드</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1c2430;--sub:#667085;--line:#e3e8ef;--brand:#1d4ed8;--brand-soft:#e8efff;--ok:#12805c;--warn:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{height:54px;background:#0f1d3a;color:#fff;display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0}
.logo{background:#fff;border-radius:8px;padding:3px 9px;display:flex;align-items:center;flex-shrink:0}
.logo img{height:34px;width:auto;display:block}
@media(max-width:760px){.logo img{height:26px} header .clock{display:none} header h1{font-size:15px}}
header h1{font-size:17px;font-weight:700;letter-spacing:.2px}
header .sp{flex:1}
header .clock{font-size:12.5px;opacity:.8}
#toggle{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;display:none}
.wrap{flex:1;display:flex;min-height:0}
nav{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto;flex-shrink:0}
nav .lbl{font-size:11px;color:var(--sub);padding:8px 10px 4px;letter-spacing:.5px}
nav a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:2px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#home{padding:24px;overflow:auto}
#home h2{font-size:20px;margin-bottom:4px}
#home p.s{color:var(--sub);font-size:13.5px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:inherit;display:block;transition:.15s}
.card:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(29,78,216,.12);transform:translateY(-2px)}
.card .ic{font-size:26px}
.card h3{font-size:16px;margin:8px 0 4px}
.card .d{color:var(--sub);font-size:13px;min-height:36px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.card .upd.fresh{color:var(--ok)} .card .upd.old{color:var(--warn)}
#viewer{display:none;flex:1;flex-direction:column;min-height:0}
.bar{height:42px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px;flex-shrink:0}
.bar b{font-size:14px}
.bar .sp{flex:1}
.bar button,.bar a{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);text-decoration:none}
.bar button:hover,.bar a:hover{background:var(--bg)}
iframe{flex:1;border:0;width:100%;background:#fff}
.err{padding:30px;color:var(--warn)}
@media(max-width:760px){#toggle{display:block} nav{position:absolute;top:54px;bottom:0;z-index:5;display:none;box-shadow:4px 0 14px rgba(0,0,0,.15)} nav.open{display:block}}
</style>
</head>

  <h1 id="title">AUTO 사업부 업무 대시보드</h1>
  <div class="sp"></div>
  <div class="clock" id="clock"></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <section id="home"></section>
    <section id="viewer">
      <div class="bar"><b id="vt"></b><span id="vu" style="color:var(--sub)"></span><span class="sp"></span>
        <a id="newtab" target="_blank" rel="noopener">새 창으로 열기</a>
        <button id="reload">새로고침</button>
      </div>
      <iframe id="frame" title="report"></iframe>
    </section>
  </main>
</div>
<script>
/* ============================================================
   ★ 메뉴 설정 ★ (update-menu.bat 을 실행하면 AUTO-MENU 구간이 reports 폴더 기준으로 자동 갱신됩니다)
   새 리포트 추가: 1) reports 폴더에 HTML 복사
                  2) 아래 REPORTS 배열에 { ... } 블록 1개 추가 (앞 블록 뒤 쉼표 주의)
   ============================================================ */
window.DASHBOARD_TITLE = "AUTO 사업부 업무 대시보드";
/* 메인(첫) 화면으로 보여 줄 리포트 ID. 비워 두면 전체 리포트 카드 목록이 메인 화면입니다. */
window.HOME_REPORT = "";

/*AUTO-MENU-START*/
window.REPORTS = [
  { id: "field-5s", title: "제조 현장 3정 5S 점검", desc: "주간 3정 5S 점검 지적·개선 현황 (매주 토요일)", file: "Claude%20outputs/field-5s.html", owner: "AUTO 생산 주재원", cycle: "주간", icon: "🧹" },
  { id: "casting-productivity", title: "캐스팅 대당 생산량", desc: "캐스팅 1~5호기 일일·주간·월간 대당 생산성 (화면 입력)", file: "Claude%20outputs/casting-productivity.html", owner: "캐스팅 생산 담당", cycle: "매일", icon: "🏭" },
  { id: "casting-daily", title: "캐스팅 일일 실적", desc: "캐스팅 일일 실적 입력·보고 (엑셀 연동, PPT 내보내기)", file: "Claude%20outputs/casting-daily.html", owner: "캐스팅 생산 담당", cycle: "매일", icon: "📈" },
  { id: "jf2-daily", title: "JF2 일일 생산 보고", desc: "LGES JF2 생산 계획 및 실적 (일일 갱신)", file: "Claude%20outputs/jf2-daily.html", owner: "생산관리 담당", cycle: "매일", icon: "📊" },
  { id: "vina-inventory", title: "VINA 재고 리포트", desc: "북미 수율 검토 기반 재고 현황", file: "Claude%20outputs/vina-inventory.html", owner: "재고관리 담당", cycle: "수시(엑셀 변경 시)", icon: "📦" }
];
/*AUTO-MENU-END*/
</script>
<script>
(function(){
  var R = window.REPORTS || [];
  var $ = function(i){return document.getElementById(i)};
  if(window.DASHBOARD_TITLE){$("title").textContent=window.DASHBOARD_TITLE;document.title=window.DASHBOARD_TITLE}

  // 시계
  function tick(){var d=new Date();$("clock").textContent=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
  function p(n){return n<10?"0"+n:n} tick(); setInterval(tick,30000);

  // 좌측 메뉴
  var HOME=null; R.forEach(function(r){if(r.id===window.HOME_REPORT)HOME=r});
  var nav=$("nav");
  nav.innerHTML='<a href="#home" data-id="home">🏠 메인 화면</a>'+(HOME?'<a href="#cards" data-id="cards">🗂️ 전체 리포트 목록</a>':'')+'<div class="lbl">REPORTS</div>'+
    R.map(function(r){return '<a href="#'+r.id+'" data-id="'+r.id+'">'+(r.icon||"📄")+' '+esc(r.title)+'</a>'}).join("");

  // 메뉴 설정 비어 있을 때 진단
  if(!R.length){
    $("home").innerHTML='<h2>메뉴를 불러오지 못했습니다</h2><p class="s" style="color:#b45309;line-height:1.8">메뉴 설정(REPORTS)이 비어 있습니다.<br>index.html 상단의 "메뉴 설정" 블록에 리포트가 1개 이상 등록돼 있는지 확인하세요 (쉼표/괄호 오류 포함)</p>';
    return;
  }
  // 홈 카드
  $("home").innerHTML='<h2>업무 현황</h2><p class="s">보고 싶은 항목을 선택하세요. 각 리포트는 담당자가 갱신합니다.</p><div class="grid">'+
    R.map(function(r){return '<a class="card" href="#'+r.id+'"><div class="ic">'+(r.icon||"📄")+'</div><h3>'+esc(r.title)+'</h3><div class="d">'+esc(r.desc||"")+
    '</div><div class="meta"><span>담당: '+esc(r.owner||"-")+'</span><span>주기: '+esc(r.cycle||"-")+'</span><span class="upd" data-upd="'+r.id+'">최종 갱신: 확인 중…</span></div></a>'}).join("")+'</div>';

  // 최종 갱신 시각: 서버(IIS)의 파일 수정시각을 읽음
  R.forEach(function(r){
    fetch(r.file,{method:"HEAD",cache:"no-store"}).then(function(res){
      if(!res.ok) throw 0;
      var lm=res.headers.get("Last-Modified"); if(!lm) throw 0;
      var d=new Date(lm), days=(Date.now()-d)/864e5;
      r.updated=fmt(d);
      document.querySelectorAll('[data-upd="'+r.id+'"]').forEach(function(e){e.textContent="최종 갱신: "+r.updated;e.className="upd "+(days<=2?"fresh":"old")});
      if(cur&&cur.id===r.id)$("vu").textContent="· 최종 갱신 "+r.updated;
    }).catch(function(){
      document.querySelectorAll('[data-upd="'+r.id+'"]').forEach(function(e){e.textContent="최종 갱신: 확인 불가"});
    });
  });
  function fmt(d){return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  // iframe 주소를 바꾸면 브라우저 기록이 쌓여 '뒤로가기'가 빈 화면이 되므로, iframe 을 새로 만들어 교체한다
  function setFrame(url){
    var old=$("frame"), f=document.createElement("iframe");
    f.id="frame"; f.title="report";
    if(url) f.src=url;
    old.parentNode.replaceChild(f,old);
  }

  // 라우팅 (#id)
  var cur=null;
  function route(){
    var id=(location.hash||"#home").slice(1);
    cur=R.filter(function(r){return r.id===id})[0]||null;
    var navId=cur?cur.id:(id==="cards"||!HOME?"cards-or-home":"home");
    if(!cur&&HOME&&id!=="cards"){cur=HOME;navId="home"}
    if(!HOME&&!cur)navId="home";
    if(HOME&&!cur&&id==="cards")navId="cards";
    nav.classList.remove("open");
    [].forEach.call(nav.querySelectorAll("a"),function(a){a.classList.toggle("on",a.dataset.id===navId)});
    if(!cur){$("home").style.display="block";$("viewer").style.display="none";setFrame("");return}
    $("home").style.display="none";$("viewer").style.display="flex";
    $("vt").textContent=cur.title;$("vu").textContent=cur.updated?"· 최종 갱신 "+cur.updated:"";
    $("newtab").href=cur.file;
    setFrame(cur.file);
  }
  window.addEventListener("hashchange",route);
  $("reload").onclick=function(){if(cur)setFrame(cur.file+"?t="+Date.now())};
  $("toggle").onclick=function(){nav.classList.toggle("open")};
  route();
})();
</script>
</body>
</html>
